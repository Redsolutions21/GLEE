<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C6FF3D">
<title>glee passport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Baloo+Bhaijaan+2:wght@500;700&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--lime:#C6FF3D;--coral:#FF2D55;--gray:#F5F5F5;--white:#FFFFFF;--ink:#1A1A1A;--mute:#6B6B6B;--line:#E7E7E7;--card:#FFFFFF;--bg:#F5F5F5;
--head:'Fredoka','Baloo Bhaijaan 2',system-ui,sans-serif;--body:'Plus Jakarta Sans','Almarai',system-ui,sans-serif}
[dir=rtl]{--head:'Baloo Bhaijaan 2','Fredoka',system-ui,sans-serif;--body:'Almarai','Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top img{height:34px;display:block}
.pill{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}
h1{font-size:34px;line-height:1.05}
h2{font-size:24px;line-height:1.15}
h3{font-size:18px}
.muted{color:var(--mute)}
.small{font-size:13px}
.hero{background:var(--lime);border-radius:28px;padding:22px 20px;margin:6px 0 16px;position:relative;overflow:hidden}
.hero h1{max-width:85%}
.hero p{margin:8px 0 0;font-size:15px}
.hero .blob{position:absolute;right:-26px;bottom:-26px;width:110px;height:110px;border-radius:50%;background:var(--coral)}
.hero .blob:after{content:'';position:absolute;left:28px;top:30px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:26px 0 0 #fff}
[dir=rtl] .hero .blob{right:auto;left:-26px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 20px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.btn.lime{background:var(--lime);color:var(--ink)}
.btn.coral{background:var(--coral);color:#fff}
.btn.ink{background:var(--ink);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--gray)}
.tag.lime{background:var(--lime)} .tag.coral{background:var(--coral);color:#fff} .tag.ink{background:var(--ink);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;cursor:pointer;text-align:start;min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-family:var(--head);font-size:19px}
.tile .tag{align-self:flex-start}
.list .item{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.av{width:46px;height:46px;border-radius:14px;background:var(--gray);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;flex:none;font-size:14px}
.av.on{background:var(--lime)}
.heart{border:0;background:transparent;font-size:22px;cursor:pointer;padding:6px;line-height:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.in{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:16px}
.in:focus{outline:none;border-color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14px;line-height:1.4}
.check input{width:22px;height:22px;accent-color:var(--ink);flex:none;margin:0}
.err{color:#C0002A;font-size:14px;margin-top:10px}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stamp{aspect-ratio:1;border-radius:50%;border:2px dashed #CFCFCF;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:13px;color:#AAA}
.stamp.on{border:0;background:var(--lime);color:var(--ink);transform:rotate(-8deg)}
.stamp.coral.on{background:var(--coral);color:#fff}
.bar{height:12px;border-radius:999px;background:var(--gray);overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);border-radius:999px;transition:width .6s}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:0}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute);cursor:pointer;padding:4px 0}
nav.tabs button.on{color:var(--ink)}
nav.tabs svg{width:24px;height:24px}
nav.tabs .scan{margin-top:-28px}
nav.tabs .scan span.ring{width:62px;height:62px;border-radius:50%;background:var(--coral);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(255,45,85,.35)}
nav.tabs .scan svg{stroke:#fff;width:28px;height:28px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;z-index:20;transition:transform .35s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:#fff;width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
#reader{width:100%;border-radius:18px;overflow:hidden;background:#000;min-height:260px}
.stars{display:flex;gap:6px;font-size:34px}
.stars button{border:0;background:transparent;cursor:pointer;color:#D6D6D6;padding:0}
.stars button.on{color:var(--coral)}
.stampfx{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none}
.stampfx div{width:180px;height:180px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--head);font-weight:700;font-size:22px;animation:pop 1.6s ease forwards;box-shadow:0 10px 40px rgba(0,0,0,.2)}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg);opacity:0}25%{transform:scale(1.1) rotate(-8deg);opacity:1}40%{transform:scale(1) rotate(-8deg)}85%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-8deg)}}
.daytabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.daytabs button{border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:8px 0;cursor:pointer;font-weight:700}
.daytabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.daytabs small{display:block;font-weight:500;font-size:11px;opacity:.8}
.sess{border-inline-start:5px solid var(--coral)}
.sess.talk{border-inline-start-color:var(--lime)}
.sample{background:#FFF3C4;border-radius:14px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
.center{text-align:center}
.spacer{height:10px}
</style>
</head>

/* ---------- state ---------- */
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
let me=null, scans=[], favs=new Set(), ratings={}, pendingPlace=null;
function toast(msg){const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
const stampCount=()=>new Set(scans.map(s=>s.place_id).filter(id=>id!=='ENTRY'&&id!=='REG')).size;

async function loadMe(){
  if(!sb) return;
  const {data:{session}}=await sb.auth.getSession();
  if(!session){me=null;return}
  const {data}=await sb.from('visitors').select('*').eq('id',session.user.id).maybeSingle();
  me=data||null;
  if(me){
    const [a,b,c]=await Promise.all([sb.from('scans').select('place_id,scanned_at').order('scanned_at'),sb.from('favorites').select('place_id'),sb.from('ratings').select('place_id,stars')]);
    scans=a.data||[]; favs=new Set((b.data||[]).map(x=>x.place_id)); ratings={}; (c.data||[]).forEach(r=>ratings[r.place_id]=r.stars);
  }
}
async function recordScan(id){
  if(!byId[id]){toast(t('unknown'));return false}
  const had=scans.some(s=>s.place_id===id);
  let recent={}; try{recent=JSON.parse(localStorage.getItem('glee_recent')||'{}')}catch(e){}
  if(recent[id]&&Date.now()-recent[id]<10*60*1000){ if(had) toast(t('already')); return true }
  const {error}=await sb.from('scans').insert({place_id:id});
  if(error){toast(t('offline'));return false}
  scans.push({place_id:id,scanned_at:new Date().toISOString()});
  recent[id]=Date.now(); try{localStorage.setItem('glee_recent',JSON.stringify(recent))}catch(e){}
  if(id!=='ENTRY'&&id!=='REG'){ if(had) toast(t('already')); else stampFx(id) }
  return true;
}
function stampFx(id){const d=document.createElement('div'); d.className='stampfx'; d.innerHTML=`<div><span style="font-size:15px">${esc(t('stamped'))}</span><span style="font-size:34px">${esc(id)}</span></div>`; document.body.appendChild(d); setTimeout(()=>d.remove(),1700)}
async function toggleFav(id,btn){
  if(!me){go('register');return}
  if(favs.has(id)){favs.delete(id); btn&&(btn.textContent='♡'); toast(t('unsaved')); await sb.from('favorites').delete().eq('place_id',id)}
  else{favs.add(id); btn&&(btn.textContent='♥'); toast(t('saved')); const {error}=await sb.from('favorites').insert({place_id:id}); if(error&&!String(error.code).startsWith('23')) toast(t('offline'))}
}
async function rate(id,stars,comment){
  ratings[id]=stars;
  const {data:{session}}=await sb.auth.getSession();
  const {error}=await sb.from('ratings').upsert({visitor_id:session.user.id,place_id:id,stars,comment:comment||null},{onConflict:'visitor_id,place_id'});
  toast(error?t('offline'):t('thanks'));
}

}

scan(){openScanner(); go('home')}

function rateBox(id,title){return `<div class="card" style="margin-top:16px"><h3>${esc(title)}</h3><div class="stars" style="margin:8px 0">${[1,2,3,4,5].map(()=>'<button type="button">★</button>').join('')}</div><input class="in" id="rateComment" placeholder="${esc(t('comment'))}"><div class="spacer"></div><button class="btn ink" id="rateSend">${esc(t('send'))}</button></div>`}
function bindList(){
  view.querySelectorAll('.item[data-id]').forEach(it=>it.onclick=e=>{if(e.target.closest('.heart'))return; go('place',it.dataset.id)});
  view.querySelectorAll('.heart[data-f]').forEach(h=>h.onclick=()=>toggleFav(h.dataset.f,h));
}

/* ---------- scanner ---------- */
let qr=null;
function idFromText(txt){
  try{const u=new URL(txt); const p=u.searchParams.get('p'); if(p) return p.toUpperCase()}catch(e){}
  const m=String(txt).trim().toUpperCase().match(/^(B\d{2}|M\d{2}|S\d-\d|ENTRY|REG)$/); return m?m[1]:null;
}
function openScanner(){
  const sh=document.createElement('div'); sh.className='sheet'; sh.innerHTML=`<div class="box"><div class="row"><h2 class="grow">${esc(t('scanTitle'))}</h2><button class="pill" id="scClose">${esc(t('close'))}</button></div><p class="muted small">${esc(t('scanHelp'))}</p><div id="reader"></div><p class="err" id="scErr" hidden></p></div>`;
  document.body.appendChild(sh);
  const close=async()=>{try{if(qr){await qr.stop();qr.clear()}}catch(e){} qr=null; sh.remove()};
  sh.onclick=e=>{if(e.target===sh)close()}; $('#scClose').onclick=close;
  if(!window.Html5Qrcode){$('#scErr').textContent=t('camErr');$('#scErr').hidden=false;return}
  qr=new Html5Qrcode('reader');
  qr.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},async txt=>{const id=idFromText(txt); await close(); if(!id){toast(t('unknown'));return} handlePlace(id)},()=>{})
    .catch(()=>{$('#scErr').textContent=t('camErr');$('#scErr').hidden=false});
}
async function handlePlace(id){
  if(!me){pendingPlace=id; go('register'); return}
  await recordScan(id); go('place',id);
}

/* ---------- routing ---------- */
function go(r,arg){const h='#'+r+(arg?'-'+encodeURIComponent(arg):''); if(location.hash===h||decodeURIComponent(location.hash)===decodeURIComponent(h)) render(); else location.hash=h}
function render(){
  const h=(location.hash||'#home').slice(1); const i=h.indexOf('-'); const r=i<0?h:h.slice(0,i); const arg=i<0?null:decodeURIComponent(h.slice(i+1));
  (R[r]||R.home)(arg);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.r===r||(r==='masterpiece'&&b.dataset.r==='edit')));
  window.scrollTo(0,0);
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>b.dataset.r==='scan'?openScanner():go(b.dataset.r));
function applyLang(){document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr'; $('#langBtn').textContent=lang==='ar'?'English':'العربية';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t)); try{localStorage.setItem('glee_lang',lang)}catch(e){}}
$('#langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar'; applyLang(); render()};
window.addEventListener('hashchange',render);

(async function start(){
  applyLang();
  if(!sb){view.innerHTML=`<p class="err">${esc(t('offline'))}</p>`;return}
  try{await loadMe()}catch(e){console.error(e)}
  const p=new URLSearchParams(location.search).get('p');
  if(p){history.replaceState(null,'',location.pathname+location.hash); const id=p.toUpperCase(); if(byId[id]){ if(me){await recordScan(id); go('place',id)} else {pendingPlace=id; go('register')} return } }
  render();
})();
</script>
